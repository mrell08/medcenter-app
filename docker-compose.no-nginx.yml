services:
  db:
    container_name: medcenter_postgres
    image: 'postgres:14'
    env_file:
      - ./.env
    ports:
      - '127.0.0.1:${POSTGRES_PORT}:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER:-postgres} -d postgres -p 5432" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  migrate:
    container_name: migrate_db
    build:
      context: .
      dockerfile: ./app/Dockerfile
    env_file:
      - ./.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c 'poetry run alembic upgrade head'
    restart: "no"

  api:
    container_name: medcenter_api
    build:
      context: .
      dockerfile: ./app/Dockerfile
    env_file:
      - ./.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      API_HOST: "0.0.0.0"
      API_PORT: 8000
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./app:/app/app:cached
      - venv_cache:/app/.venv

  web:
    container_name: medcenter_web
    build:
      context: ./web
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      API_HOST: api
      API_PORT: 8000
      APP_HOST: "0.0.0.0"
      APP_PORT: 5173
      VITE_API_URL: "http://api:8000"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app/web:cached
      - web_node_modules:/app/web/node_modules
      - /app/web/.vite

volumes:
  pg_data:
  venv_cache:
  web_node_modules:
